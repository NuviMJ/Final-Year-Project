name: qolguard
description: "QoLGuard — early detection of quality-of-life decline in long-term medication users."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management and dependency injection
  flutter_riverpod: ^3.3.2

  # Navigation with authentication redirect guards
  go_router: ^17.0.0

  # HTTP client for the FastAPI backend
  dio: ^5.11.0

  # JWT storage backed by Keystore / Keychain (privacy requirement)
  flutter_secure_storage: ^10.3.1

  # Offline cache of assessments and predictions
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3

  # History screen trend charts
  fl_chart: ^1.1.0

  # Date and number formatting
  intl: ^0.20.2

  # Immutable models with generated JSON serialisation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

  # Code generation for freezed models and JSON serialisation.
  # Run: dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  # Only the wordmark is declared. The other files in assets/images/ are
  # unused stock artwork in a red palette that clashes with the app's teal.
  assets:
    - assets/images/QoLGuard_wordmark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/QoLGuard_icon.png"
