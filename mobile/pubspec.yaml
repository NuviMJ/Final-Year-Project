name: qolguard
description: "QoLGuard — early detection of quality-of-life decline in long-term medication users."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Sinhala and English interface text
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management and dependency injection
  flutter_riverpod: ^3.3.2

  # Navigation with authentication redirect guards
  go_router: ^17.0.0

  # HTTP client for the FastAPI backend
  dio: ^5.11.0

  # On-device storage of assessments and reminders. shared_preferences rather
  # than sqflite, which has no web or Windows implementation and would break
  # the development loop.
  shared_preferences: ^2.5.3

  # History screen trend charts
  
  fl_chart: ^0.69.2

  # Date and number formatting
  intl: ^0.20.2

  # Immutable models with generated JSON serialisation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

  # Code generation for freezed models and JSON serialisation.
  # Run: dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb
  generate: true

  fonts:
    # Bundled because Roboto carries no Sinhala glyphs and not every
    # device ships a Sinhala font.
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala.ttf

  # Only the wordmark is declared. The other files in assets/images/ are
  # unused stock artwork in a red palette that clashes with the app's teal.
  assets:
    - assets/images/QoLGuard_wordmark.png

# Launcher icon generation. Run after changing the artwork:
#     dart run flutter_launcher_icons
#
# The source is a full-bleed rounded square with the shield centred, so it also
# serves as the adaptive foreground. Android crops adaptive icons to roughly the
# central two thirds; setting the background to the same teal makes that crop
# invisible rather than leaving a white ring around the shield.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/QoLGuard_icon.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/images/QoLGuard_icon.png"
  remove_alpha_ios: true
